name: Build One For All Fabric Mod

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload uniquely named mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: OneForAll-MC1.20.1-Fabric-1.0.2
          path: build/libs/OneForAll-MC1.20.1-Fabric-1.0.2.jar
