
name: Build One For All Fabric Mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build mod
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: one-for-all-fabric-1.20.1
          path: build/libs/one-for-all-1.0.0.jar
